# Production overlay for the homeserver. Never loaded automatically -- it must be named:
#
#     docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# Naming it explicitly also means `compose.override.yaml` is NOT read, which is the point: the
# dev file's bind mounts and published ports are absent here because they were never merged in,
# not because something undid them.
#
# Four things this file is responsible for:
#   1. Nothing publishes a host port. Docker writes its own iptables rules and bypasses ufw
#      entirely, so a published port is reachable from the whole LAN regardless of the
#      firewall. Reachability comes from Caddy on the `edge` network instead.
#   2. Postgres is on a stack-private network that `edge` cannot reach.
#   3. The containers survive a reboot and do not fill the disk with logs.
#   4. Healthchecks that mean something, and ordering that respects them.

services:
  postgres:
    environment:
      # Required, not defaulted. `${VAR:?message}` makes compose abort *before* starting
      # anything, naming the variable and printing the message -- which is the difference
      # between "POSTGRES_PASSWORD is required" at deploy time and a container that came up
      # happily on the password `gex` and is now serving the LAN.
      #
      # These override the `:-gex` dev defaults in compose.yaml. See .env.example for the full
      # list of keys the server's .env must contain.
      POSTGRES_USER: ${POSTGRES_USER:?required - set it in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required - set it in .env (see .env.example); changing it here does NOT change an existing database, see README}
      POSTGRES_DB: ${POSTGRES_DB:?required - set it in .env (see .env.example)}
    volumes:
      # Bind mount rather than a named volume, so the entire stack -- database, Parquet tree,
      # compose files and .env -- is one directory that tars as a unit.
      #
      # This directory must exist and be owned by uid/gid 999 (the postgres user inside
      # postgres:16) BEFORE the first `up`, or initdb fails: Docker creates a missing
      # bind-mount source as root:root and postgres refuses to use it. See the README's deploy
      # steps. Moving an existing database here is a dump/restore, not a copy -- also in the
      # README.
      - ./data/postgres:/var/lib/postgresql/data
    # T86. No `mem_limit` here, deliberately, while every other service has one. Postgres
    # manages its own memory through shared_buffers and work_mem, and most of what its cgroup
    # is charged is page cache the kernel reclaims under pressure -- its *heap* moved 3 MB in
    # the four hours its total went 70 -> 166 MB. A cap sized against the total would OOM-kill
    # the database mid-write to reclaim cache it would have given back for free.
    networks:
      # `internal` only. Not on `edge`, so Caddy -- and anything else sharing that proxy
      # network -- has no route to 5432 at all. Combined with publishing no host port, the
      # database is reachable only from `backend`.
      internal: {}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    # Distinct from the dev tag (see compose.override.yaml) so the two builds cannot overwrite
    # each other. If this image does not exist yet, compose builds it -- correctly targeted --
    # rather than reusing a dev image that happens to share a name.
    image: gex-backend:prod
    environment: &prod_backend_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?required - set it in .env}:${POSTGRES_PASSWORD:?required - set it in .env}@postgres:5432/${POSTGRES_DB:?required - set it in .env}
      # T76. Required here for the same reason the credentials above are: a production stack
      # that silently fell back to a well-known default password for a role with SELECT on
      # every module's data would be worse than one that refuses to start and says which
      # variable is missing. Unlike POSTGRES_PASSWORD this one IS re-applied on every boot
      # (`app.core.ro_role`), so changing it here and restarting really does rotate it.
      QUANTDESK_RO_PASSWORD: ${QUANTDESK_RO_PASSWORD:?required - set it in .env (see .env.example)}
      # T125. The homeserver's own terminal, on the stack network (plans/thetadata/README.md).
      THETADATA_URL: http://theta-terminal:25503
    networks:
      # Both: `internal` to reach postgres, `edge` so Caddy can reach it on 8001. This is the
      # only service on both networks, and it is the only path from `edge` to the database.
      internal: {}
      edge:
        aliases:
          # An explicit, stack-prefixed name for Caddy to target. Compose also registers the
          # bare service name (`backend`) as an alias, but `edge` is shared with every other
          # stack behind this proxy -- and a second stack with a service called `backend`
          # would make that name ambiguous, resolving to whichever container answers first.
          # `gex-backend` is what the Caddyfile uses.
          - gex-backend
    restart: unless-stopped
    # T86. `mem_limit`, not `deploy.resources.limits.memory`: the latter is a swarm-shaped key
    # that the Compose v2 CLI happens to honour, and this stack is plain compose. The two
    # `deploy.resources.limits.cpus` entries below are the same key for CPU and stay as they
    # are; do not read them as a precedent for putting memory there too.
    #
    # 1 GB against an observed 126 MB heap. The ceiling exists to stop one service taking the
    # host, not to fit a number -- and this container also hosts `docker exec ... python -m
    # app.mcp` sessions (see plans/capture-memory/README.md), which are charged here.
    mem_limit: 1024m
    healthcheck:
      # Hits GET /health (root level -- the routers are all under /api, this one is not) and
      # requires `db: ok`, so a backend whose Postgres has gone away reports unhealthy instead
      # of serving 500s while looking fine. Deliberately not /api/health/capture: that one
      # queries every symbol in the ~125-symbol scan universe and is far too heavy to run on a
      # 30-second loop.
      #
      # CMD rather than CMD-SHELL so the quoting inside the python snippet is not also being
      # parsed by a shell. `python` resolves to the image's virtualenv interpreter via PATH;
      # no curl or wget is installed in the slim base.
      test:
        - CMD
        - python
        - -c
        - import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)).get('db') == 'ok' else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous, because the container runs `alembic upgrade head` before uvicorn binds. A
      # migration on a populated database can take a while, and failing the healthcheck during
      # it would mark a perfectly healthy deploy as broken.
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # T75's capture worker. `internal` only: it talks to Postgres and to the outside world
  # (Cboe, Yahoo, issuer pages) but nothing ever talks to *it*, so it has no reason to be on
  # `edge` and no port to publish.
  #
  # No healthcheck, deliberately. There is no HTTP surface to probe and no cheap question worth
  # asking -- "is the process alive" is what `restart: unless-stopped` already handles, and "did
  # the 16:20 capture actually happen" is what `GET /api/gex/health/capture` answers properly,
  # across the whole symbol universe, from the API. A shallow healthcheck here would mostly
  # succeed while capture was quietly broken, which is worse than none.
  gex-capture:
    # A distinct tag from `gex-backend:prod`, for the reason spelled out in
    # compose.override.yaml: two building services cannot share one tag without racing the
    # export. Same Dockerfile, same `runtime` target, fully layer-cached.
    image: gex-capture:prod
    environment: *prod_backend_environment
    networks:
      internal: {}
    restart: unless-stopped
    # T86. 1.5 GB against an observed 626 MB water mark. Generous on purpose: the free Cboe
    # endpoint serves only "now", so a cap that trips during the 16:20 capture converts a
    # memory problem into a permanent hole in the one dataset this repo cannot backfill.
    # If this is ever hit, check `docker inspect -f '{{.State.OOMKilled}}'` and RAISE it.
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # T77. Same image discipline as `gex-capture` above, plus the one thing this worker needs
  # that the others do not: a CPU ceiling.
  #
  # The systemd unit it replaces ran with `Nice=10` so a saturating search could not starve
  # anything else on the VPS. A search cycle is thousands of backtests and will happily consume
  # every core it is given; on the same host as the API that means request latency collapsing
  # every night at 02:00. `cpus` is the compose-native equivalent -- a hard ceiling rather than
  # a scheduling hint, which is the stronger guarantee and the one worth having when the thing
  # being protected is the only interactive service on the box.
  #
  # Only in prod. In dev the laptop's scheduler and the user's patience are the limit, and a
  # ceiling would only make a hand-run cycle slower for no benefit.
  research-search:
    image: research-search:prod
    environment: *prod_backend_environment
    networks:
      internal: {}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Two cores. Leaves headroom on any realistic VPS for the API, Postgres and Caddy,
          # and a cycle that takes twice as long costs nothing -- it is scheduled nightly with
          # an hour of misfire grace and nothing waits on its result.
          cpus: "2.0"
          # T86. 1.5 GB against an observed 96 MB steady state. Wide, because a search cycle's
          # peak is nothing like its idle: it holds panels of OHLCV across thousands of
          # backtests, and a cycle killed halfway leaves the trial registry short of a night's
          # work.
          #
          # Here rather than as a top-level `mem_limit` -- unlike every other service in this
          # file -- only because this service already has a `deploy.resources.limits` block for
          # cpus, and compose refuses a project where the two forms disagree:
          #   can't set distinct values on 'mem_limit' and 'deploy.resources.limits.memory'
          # An unset key counts as disagreeing, so the limit has to live wherever cpus does.
          memory: 1500m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # T79. Like `research-search`, this one gets a CPU ceiling: the nightly sequence pulls five
  # sources and recomputes the transmission graph over the full panel, and it must not be able
  # to starve the API. One core is ample -- the work is mostly waiting on HTTP.
  terminal-ingest:
    image: terminal-ingest:prod
    environment: *prod_backend_environment
    networks:
      internal: {}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # T86. 768 MB against an observed 50 MB. The nightly sequence recomputes the
          # transmission graph over the full panel, so the peak is well above the idle, but
          # this is the smallest Python service here by some way. In the deploy block for the
          # same reason as `research-search` above.
          memory: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # T104. The watchdog. Tiny by construction: one query an hour and, when configured, one
  # HTTPS POST. `internal` only -- it reaches Postgres and api.telegram.org, and nothing
  # reaches it. `restart: unless-stopped` matters more here than elsewhere: a watchdog that
  # stays down after a crash is worse than no watchdog, because its silence reads as health.
  capture-watch:
    image: capture-watch:prod
    environment: *prod_backend_environment
    networks:
      internal: {}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # T125. The Theta Terminal (plans/thetadata/README.md). Defined HERE and not in compose.yaml
  # because the homeserver owns it: one ThetaData login is one live terminal session, and a
  # second session started from a laptop can knock this one off. Dev gets a terminal only by
  # naming compose.theta-dev.yaml explicitly.
  #
  # Not `:?required`, deliberately: ThetaData is an add-on, and a missing credential should
  # stop this one container (the entrypoint exits 64 naming the variables), not refuse to
  # render the whole stack and take the free Cboe capture down with it.
  theta-terminal:
    image: theta-terminal:prod
    build:
      context: ./theta
    environment:
      THETADATA_API_KEY: ${THETADATA_API_KEY:-}
      THETADATA_USERNAME: ${THETADATA_USERNAME:-}
      THETADATA_PASSWORD: ${THETADATA_PASSWORD:-}
    volumes:
      # The bootstrap downloads the real terminal jar here; kept so a restart does not
      # re-download ~100 MB.
      - ./data/theta-lib:/opt/theta/lib
    networks:
      # `internal` only: the workers reach it, Caddy and the LAN do not. No published port.
      internal: {}
    restart: unless-stopped
    # Java heap is -Xmx2g (THETA_JAVA_OPTS); the cap leaves room for metaspace and netty.
    mem_limit: 2500m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: gex-frontend:prod
    build:
      args:
        # Empty on purpose. The bundle then carries no origin and resolves every request
        # against the page it was served from (see frontend/src/api/client.ts), which is what
        # makes the same host work as homeserver.local on the LAN and as a Tailscale name
        # remotely without a rebuild. Vite inlines VITE_* at BUILD time, so this genuinely has
        # to be a build arg -- setting it as a runtime environment variable would do nothing.
        VITE_API_BASE_URL: ""
    networks:
      # `edge` only. The static bundle never talks to postgres, and the browser reaches the
      # API through Caddy, not through this container.
      edge:
        aliases:
          - gex-frontend
    restart: unless-stopped
    # T86. 128 MB. nginx serving a static bundle; if this is ever approached, something is
    # wrong rather than busy.
    mem_limit: 128m
    healthcheck:
      # busybox wget, present in nginx:alpine; there is no curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  internal:
    driver: bridge
  edge:
    # Created once, outside this stack, and shared with Caddy:
    #     docker network create edge
    # `external: true` means compose will refuse to start if it does not exist rather than
    # quietly creating a `gex_edge` that Caddy is not attached to.
    external: true
