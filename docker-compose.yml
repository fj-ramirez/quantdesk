services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gex
      POSTGRES_PASSWORD: gex
      POSTGRES_DB: gex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://gex:gex@postgres:5432/gex
      DATA_DIR: /data
      PROVIDER: cboe
      SYMBOLS: SPX,SPY,QQQ
      TZ: America/New_York
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
