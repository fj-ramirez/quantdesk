services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gex
      POSTGRES_PASSWORD: gex
      POSTGRES_DB: gex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://gex:gex@postgres:5432/gex
      DATA_DIR: /data
      PROVIDER: cboe
      SYMBOLS: SPX,SPY,QQQ,GLD,DIA
      TZ: America/New_York
      # T18/T32. Taken from the root `.env` via substitution, with the same defaults the
      # settings themselves carry, so that file is the single knob for both. Without an entry
      # here the container would never see them: this service declares `environment:` and no
      # `env_file:`, so the root `.env` is only used for substitution *into* this file, and the
      # `backend/.env` visible through the bind mount is the container's own -- which is the
      # trap that made "I enabled intraday in .env" a no-op on 2026-09-11.
      INTRADAY_ENABLED: ${INTRADAY_ENABLED:-false}
      INTRADAY_STRIKE_RETENTION_DAYS: ${INTRADAY_STRIKE_RETENTION_DAYS:-30}
      INTRADAY_BARS_ENABLED: ${INTRADAY_BARS_ENABLED:-false}
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
