[project]
name = "gex-backend"
version = "0.1.0"
description = "GEX analysis backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "apscheduler",
    "httpx",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    # T77 (research / EdgeLab). Worker-only: `ccxt` fetches crypto OHLCV and `yfinance` the
    # stock/forex/futures side, both exclusively from `research-search`, and `PyYAML` reads
    # `config/research.yaml`. They are in the single shared dependency set rather than behind a
    # Dockerfile stage of their own, deliberately -- one image for the API and every worker is
    # what makes `docker compose up` one build, and splitting it buys a smaller runtime layer
    # at the cost of a second stage to keep in step. Revisit if the image becomes a problem;
    # `plans/quantdesk/02-research-module.md` names it as an accepted trade.
    "ccxt",
    "yfinance",
    "PyYAML",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    # T79. Needed only by `scripts/migrate_xactx.py`, the one-shot import of xactx's old
    # DuckDB store. Deliberately dev-only: the runtime image builds with `--no-dev`, and
    # nothing the application serves has any reason to be able to open a DuckDB file. Keeping
    # it declared (rather than installed ad hoc when someone needs it) is what makes that
    # migration reproducible a year from now.
    #
    # `pytz` was NOT carried over. It was in xactx's dependencies only because DuckDB needed it
    # to return TIMESTAMPTZ through `fetchall`; a grep across the ported module confirms zero
    # uses, and psycopg returns aware datetimes natively.
    "duckdb",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# T77. The EdgeLab science modules came over from `projects/research` essentially unchanged --
# that repo is git-initialised at `bcd727d` and the port is meant to stay diffable against it,
# so that "did the backtester change?" is answerable by `diff` rather than by reading. These
# four rules all fire on the original's idiom, and none of them is a defect:
#
#   DTZ011  `date.today()`. `run_date` is a local calendar-day stamp and `trials_on(day)`
#           compares against it; making it tz-aware would change which day a trial is filed
#           under, which is a research-visible change, not a lint fix.
#   RUF012  `param_space` dicts as class attributes on the strategy dataclasses. Correct as
#           `ClassVar`, but that is nine edits to the file most central to the science.
#   RUF007  `zip(edges[:-1], edges[1:])` in the walk-forward window split. `pairwise` is
#           nicer and identical; not worth a diff in the validation path.
#   UP017   `datetime.timezone.utc` rather than the `datetime.UTC` alias.
#
# Revisit when the module no longer needs to be diffed against the standalone repo -- at that
# point these become ordinary cleanups. New code in this module is not exempt: the list is
# scoped to the ported files, and `registry.py`, `config.py`, `nightly.py` and `jobs/` are
# linted normally.
"app/modules/research/backtest.py" = ["DTZ011", "RUF007", "RUF012", "UP017"]
"app/modules/research/paper.py" = ["DTZ011", "RUF007", "RUF012", "UP017"]
"app/modules/research/report.py" = ["DTZ011", "RUF007", "RUF012", "UP017"]
"app/modules/research/robustness.py" = ["DTZ011", "RUF007", "RUF012", "UP017"]
"app/modules/research/search.py" = ["DTZ011", "RUF007", "RUF012", "UP017"]
"app/modules/research/strategies.py" = ["DTZ011", "RUF007", "RUF012", "UP017"]
"app/modules/research/validation.py" = ["DTZ011", "RUF007", "RUF012", "UP017"]
"app/modules/research/xs.py" = ["DTZ011", "RUF007", "RUF012", "UP017"]

[tool.ruff.lint.isort]
# T75. Ruff infers which packages are first-party by resolving the imported path on disk. Once
# GEX moved to `app.modules.gex`, the frozen revision scripts in `alembic/versions/` that still
# `import app.models.db` (see `alembic/env.py` for why they are deliberately not rewritten)
# stopped resolving, were reclassified as third-party, and `ruff check` began demanding they be
# re-sorted -- in files this task is forbidden to touch.
#
# Stating it is also simply more correct than leaving it to inference: `app` is this project's
# own package whether or not a particular submodule happens to exist when ruff looks.
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
