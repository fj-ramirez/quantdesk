# Serves the built SPA. Copied to /etc/nginx/conf.d/default.conf, replacing the stock server
# block. This container serves static files only -- it never proxies to the backend. The
# browser reaches /api/* through Caddy, which routes it to the backend container directly (see
# the Caddyfile block in the README); an extra proxy hop here would also break the SSE stream
# at /api/stream/{underlying}, which nginx would buffer by default.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS and is the only thing that talks to this container, so it -- not
    # nginx -- is what the browser's address bar reflects. Keep nginx from advertising its
    # version in error pages and headers regardless.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits hashed filenames into /assets/ (index-a1b2c3d4.js). The hash changes whenever
    # the content does, so the file at a given URL is immutable by construction and can be
    # cached for as long as the browser is willing to.
    location /assets/ {
        # One header, not two. nginx's `expires` directive emits its own Cache-Control, so
        # pairing it with an `add_header Cache-Control` sends the field twice -- legal, since
        # a client concatenates them, but needlessly ambiguous to anything reading the
        # response. Setting Cache-Control directly says the whole policy in one place, and
        # `immutable` (which `expires` cannot express) is the part that actually stops the
        # revalidation request on every reload.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html is the one file whose URL stays the same while its content changes -- it is
    # what points at the current hashed bundle. Cached, it would keep loading the previous
    # deploy's assets, which have since been deleted from the image: a blank page after every
    # update. Hence no-store rather than a short max-age.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback. React Router owns /scan, /history and the rest client-side; there is no
    # file at those paths, so anything that is not a real file is handed index.html and routed
    # in the browser. Without this, a reload or a shared deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
